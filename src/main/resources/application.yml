spring:
  application:
    name: expense-simplified
  main:
    banner-mode: "off"          # turn off the spring banner on startup
  shell:
    interactive:
      enabled: true
  config:
    import:
      - optional:classpath:mapping-rules.yml
      - optional:classpath:instruments.yml
      - optional:classpath:export-profile.yml
      - optional:classpath:friends.yml
      - optional:classpath:email-enrichment.yml

  datasource:
    url: jdbc:sqlite:${user.home}/.expense-simplified/expense-simplified.db?journal_mode=WAL&foreign_keys=ON&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
#  persistence: in-memory
  persistence: sqlite
  plugins:
    email-enrichment:
      enabled: false
      default-config:
        ssl: true
        port: 993
        timeout-seconds: 15
        platforms:
          - SWIGGY
          - AMAZON
          - FLIPKART
      accounts: []

logging:
  file:
    name: app.log
  threshold:
    console: OFF                # turn off console log appender
    file: INFO                  # log level info